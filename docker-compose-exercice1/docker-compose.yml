services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: drupal
      POSTGRES_USER: drupal
      POSTGRES_PASSWORD: drupal
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drupal -d drupal"]
      interval: 5s
      retries: 10

  drupal:
    image: drupal:10-apache
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - drupal_sites:/var/www/html/sites/default

volumes:
  pg_data:
  drupal_sites:
